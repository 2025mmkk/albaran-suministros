<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albarán Móvil v8.0</title>
  <script src="https://cloudflare.com"></script>
  <script src="https://unpkg.com"></script>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; color: #161616; margin: 0; padding: 15px; }
    .card { background: #fff; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2, h3 { margin-top: 0; color: #0f62fe; font-size: 1.1rem; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    select, input { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 14px; background: #0f62fe; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
    button.success { background: #198038; }
    button.secondary { background: #393939; }
    button.danger { background: #da1e28; width: auto; padding: 6px 10px; font-size: 0.85rem; }
    #reader { width: 100%; margin-bottom: 10px; display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px 4px; text-align: left; }
    .total-box { font-size: 1.25rem; font-weight: bold; text-align: right; margin-top: 10px; color: #198038; }
    .status { padding: 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; background: #defbe6; color: #0e6027; }
    .err { background: #fff1f1; color: #a2191f; }
  </style>
</head>
<body>

  <!-- PANTALLA 1: CONFIGURACIÓN -->
  <div class="card" id="p1">
    <h2>⚙️ Configuración de Envío (v8.0)</h2>
    <label>📱 WhatsApp destino (ej: 34600112233):</label>
    <input type="tel" id="wa" placeholder="34600112233">
    
    <label>📧 Correo destino:</label>
    <input type="email" id="em" placeholder="almacen@empresa.com">

    <button type="button" class="success" onclick="irApp(true)">💾 Guardar y Entrar</button>
    <button type="button" class="secondary" onclick="irApp(false)">⏩ Entrar directamente</button>
  </div>

  <!-- PANTALLA 2: APLICACIÓN -->
  <div id="p2" style="display:none;">
    <div id="msgDb" class="status">⏳ Conectando con datos.xlsx...</div>
    
    <div id="boxManual" style="display:none;" class="card">
      <label>📂 Cargar Excel manualmente desde este dispositivo:</label>
      <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="leerArchivoLocal(this)">
    </div>

    <div class="card">
      <h2>1. Cliente</h2>
      <select id="selCli" onchange="document.getElementById('ctaCli').value = this.value"></select>
      <input type="text" id="ctaCli" readonly style="background:#eee;" placeholder="Cuenta cliente">
    </div>

    <div class="card">
      <h2>2. Escanear o Añadir</h2>
      <button type="button" class="secondary" id="btnCam" onclick="cam()">📷 Abrir Cámara</button>
      <div id="reader"></div>
      <input type="text" id="cod" placeholder="Código de barras...">
      <input type="number" id="cant" value="1" min="1">
      <button type="button" onclick="addArt()">➕ Añadir al Albarán</button>
    </div>

    <div class="card">
      <h3>Albarán Actual</h3>
      <table>
        <thead><tr><th>Artículo</th><th>Cant</th><th>Subt</th><th></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
      <div class="total-box">TOTAL: <span id="tot">0.00</span> €</div>
      <br>
      <button type="button" class="success" onclick="enviar()">🚀 Finalizar y Enviar</button>
      <button type="button" class="secondary" onclick="document.getElementById('p2').style.display='none';document.getElementById('p1').style.display='block';">⚙️ Cambiar Destino</button>
    </div>
  </div>

  <script>
    var arts = [];
    var lineas = [];
    var qr = null;
    var camOn = false;

    function irApp(guardar) {
      if (guardar) {
        var w = document.getElementById('wa').value.replace(/\D/g, '');
        var e = document.getElementById('em').value.trim();
        if (!w && !e) {
          alert('Escribe un teléfono o correo, o pulsa Entrar directamente.');
          return;
        }
        try {
          localStorage.setItem('cfg_v8', JSON.stringify({ w: w, e: e }));
        } catch (err) {}
      }
      document.getElementById('p1').style.display = 'none';
      document.getElementById('p2').style.display = 'block';
      cargarExcel();
    }

    function procesarBuffer(buf) {
      var m = document.getElementById('msgDb');
      try {
        var wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
        var nombreHoja = wb.SheetNames.at(0);
        var hoja = Reflect.get(wb.Sheets, nombreHoja);
        var rows = XLSX.utils.sheet_to_json(hoja, { header: 'A', defval: '' });
        
        arts = [];
        var sel = document.getElementById('selCli');
        sel.innerHTML = '';
        var modo = '';

        rows.forEach(function(r) {
          var bCol = String(r.B || '').trim();
          var cCol = String(r.C || '').trim();
          if (bCol === 'ARTICULO') { modo = 'A'; return; }
          if (bCol === 'NOMBRE DE RESTAURANTE') { modo = 'C'; return; }

          if (modo === 'A' && bCol) {
            arts.push({
              nom: bCol,
              u: cCol,
              c: String(r.D || '').trim(),
              eq: parseFloat(r.E) || 1,
              pu: parseFloat(r.F) || 0,
              pc: parseFloat(r.G) || 0
            });
          } else if (modo === 'C' && bCol) {
            var o = document.createElement('option');
            o.text = bCol;
            o.value = cCol;
            sel.add(o);
          }
        });

        if (sel.options.length > 0) {
          document.getElementById('ctaCli').value = sel.value;
        }
        m.className = 'status';
        m.innerHTML = '✅ ¡Listo! Cargados ' + arts.length + ' artículos y ' + sel.options.length + ' clientes.';
        document.getElementById('boxManual').style.display = 'none';
      } catch (e) {
        m.className = 'status err';
        m.innerHTML = '❌ Error al leer el formato del Excel: ' + e.message;
        document.getElementById('boxManual').style.display = 'block';
      }
    }

    function cargarExcel() {
      var m = document.getElementById('msgDb');
      var baseUrl = window.location.href.split('?').at(0);
      if (baseUrl.endsWith('index.html')) {
        baseUrl = baseUrl.replace('index.html', '');
      } else if (!baseUrl.endsWith('/')) {
        baseUrl += '/';
      }
      var urlExcel = baseUrl + 'datos.xlsx?t=' + Date.now();

      fetch(urlExcel)
        .then(function(r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.arrayBuffer();
        })
        .then(function(b) {
          procesarBuffer(b);
        })
        .catch(function(err) {
          m.className = 'status err';
          m.innerHTML = '❌ No se encontró datos.xlsx automático (' + err.message + '). Selecciónalo abajo:';
          document.getElementById('boxManual').style.display = 'block';
        });
    }

    function leerArchivoLocal(input) {
      var file = input.files.item(0);
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function(e) {
        procesarBuffer(e.target.result);
      };
      reader.readAsArrayBuffer(file);
    }

    function cam() {
      var d = document.getElementById('reader');
      var b = document.getElementById('btnCam');
      if (!camOn) {
        d.style.display = 'block';
        b.innerText = '⏹️ Cerrar Cámara';
        qr = new Html5Qrcode('reader');
        qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 220 }, function(txt) {
          document.getElementById('cod').value = txt;
          addArt();
          qr.pause();
          setTimeout(function() { qr.resume(); }, 1200);
        }).catch(function(e) {
          alert('Error cámara: ' + e);
        });
        camOn = true;
      } else {
        qr.stop().then(function() {
          d.style.display = 'none';
          b.innerText = '📷 Abrir Cámara';
          camOn = false;
        });
      }
    }

    function addArt() {
      var c = document.getElementById('cod').value.trim();
      var q = parseInt(document.getElementById('cant').value, 10) || 1;
      if (!c) return;
      var enc = null;
      var tipo = 'UNID';
      var pr = 0;

      arts.forEach(function(item) {
        if (item.u === c && !enc) {
          enc = item;
          pr = enc.pu;
        } else if (item.c === c && !enc) {
          enc = item;
          tipo = 'CAJA';
          pr = enc.pc || (enc.pu * enc.eq);
        }
      });

      if (!enc) {
        alert('Código no encontrado: ' + c);
        return;
      }

      lineas.push({ cod: c, nom: enc.nom + ' (' + tipo + ')', q: q, pr: pr, sub: q * pr });
      document.getElementById('cod').value = '';
      document.getElementById('cant').value = 1;
      pintar();
    }

    function pintar() {
      var tb = document.getElementById('tb');
      tb.innerHTML = '';
      var t = 0;
      lineas.forEach(function(l, idx) {
        t += l.sub;
        tb.innerHTML += '<tr><td>' + l.nom + '</td><td>' + l.q + '</td><td>' + l.sub.toFixed(2) + '€</td><td><button class="danger" onclick="lineas.splice(' + idx + ',1);pintar()">X</button></td></tr>';
      });
      document.getElementById('tot').innerText = t.toFixed(2);
    }

    function enviar() {
      if (!lineas.length) {
        alert('Albarán vacío');
        return;
      }
      var sel = document.getElementById('selCli');
      var opcion = sel.options.item(sel.selectedIndex);
      var cli = opcion ? opcion.text : 'Cliente';
      var cta = document.getElementById('ctaCli').value;
