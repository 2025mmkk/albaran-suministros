<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albarán Suministros v14</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; color: #161616; margin: 0; padding: 12px; }
    .card { background: #fff; border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2, h3 { margin: 0 0 10px 0; color: #0f62fe; font-size: 1.05rem; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.85rem; }
    select, input { width: 100%; padding: 11px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; background: #fff; }
    button { width: 100%; padding: 13px; background: #0f62fe; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    button.success { background: #198038; }
    button.secondary { background: #393939; }
    button.danger { background: #da1e28; width: auto; padding: 5px 10px; font-size: 0.8rem; }
    video { width: 100%; max-height: 260px; background: #000; border-radius: 8px; margin-bottom: 10px; display: none; object-fit: cover; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border-bottom: 1px solid #ddd; padding: 7px 4px; text-align: left; }
    .total-box { font-size: 1.25rem; font-weight: bold; text-align: right; margin-top: 10px; color: #198038; }
    .status { padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; background: #defbe6; color: #0e6027; font-weight: bold; }
    details { background: #e5f6ff; padding: 10px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #0f62fe; }
    summary { font-weight: bold; cursor: pointer; color: #0f62fe; }
    .aviso { font-size: 0.85rem; color: #a2191f; background: #fff1f1; padding: 8px; border-radius: 6px; margin-bottom: 8px; display: none; }
    .fila-doble { display: flex; gap: 10px; }
    .fila-doble > div { flex: 1; }
  </style>
</head>
<body class="notranslate">

  <div id="msgDb" class="status">⏳ Iniciando v14...</div>

  <!-- CONFIGURACIÓN DESPLEGABLE -->
  <details id="panelConfig">
    <summary>⚙️ Configurar WhatsApp o Correo de destino</summary>
    <div style="margin-top: 10px;">
      <label>📱 WhatsApp destino (ej: 34600112233):</label>
      <input type="tel" id="wa" placeholder="34600112233">
      <label>📧 Correo destino:</label>
      <input type="email" id="em" placeholder="almacen@empresa.com">
      <button type="button" class="success" onclick="guardarDestino()">💾 Guardar Destino</button>
    </div>
  </details>

  <!-- 1. CLIENTE Y FECHA -->
  <div class="card">
    <h2>1. Datos del Albarán</h2>
    <label for="selCli">Restaurante:</label>
    <select id="selCli" onchange="document.getElementById('ctaCli').value = this.value"></select>

    <div class="fila-doble">
      <div>
        <label for="ctaCli">Cuenta Cliente:</label>
        <input type="text" id="ctaCli" readonly style="background:#eee;" placeholder="Cuenta">
      </div>
      <div>
        <label for="fechaAlb">📅 Fecha Albarán:</label>
        <input type="date" id="fechaAlb">
      </div>
    </div>
  </div>

  <!-- 2. ESCÁNER NATIVO -->
  <div class="card">
    <h2>2. Escaneo de Suministros</h2>
    <button type="button" class="secondary" id="btnCam" onclick="alternarCamara()">📷 Abrir Cámara</button>
    <div id="camMsg" class="aviso"></div>
    <video id="videoPreview" playsinline autoplay muted></video>

    <label>Código de Barras (EAN Unidad o Caja):</label>
    <input type="text" id="cod" placeholder="Escanea o escribe el código...">
    
    <div style="display:flex; gap:8px;">
      <input type="number" id="cant" value="1" min="1" style="flex:1;">
      <button type="button" onclick="agregarArticulo()" style="flex:2;">➕ Añadir</button>
    </div>
  </div>

  <!-- 3. ALBARÁN ACTUAL -->
  <div class="card">
    <h3>Albarán Actual</h3>
    <table>
      <thead><tr><th>Artículo</th><th>Cant</th><th>Subt</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="total-box">TOTAL: <span id="tot">0.00</span> €</div>
    <br>
    <button type="button" class="success" onclick="finalizarAlbaran()">🚀 Finalizar, Descargar y Enviar</button>
  </div>

  <script>
    var arts = new Array();
    var lineas = new Array();
    var streamActivo = null;
    var intervaloScan = null;

    // 1. Poner fecha de hoy
    var hoy = new Date();
    document.getElementById('fechaAlb').value = hoy.getFullYear() + '-' + String(hoy.getMonth() + 1).padStart(2, '0') + '-' + String(hoy.getDate()).padStart(2, '0');

    // 2. Cargar lista base de clientes sin usar corchetes
    var sel = document.getElementById('selCli');
    function addCli(nombre, cuenta) {
      var o = document.createElement('option');
      o.text = nombre;
      o.value = cuenta;
      sel.add(o);
    }

    addCli("LA MAR DE FRIA ALHAURIN", "43003904");
    addCli("LA MAR DE FRIA HOSPITAL CIVIL / ARROYO LOS ANGELES", "43003904");
    addCli("LA SUBASTA BENALMADENA", "43004696");
    addCli("OASIS BEACH CLUB", "43004678");
    addCli("CAMPOSOL", "43001140");
    addCli("ENTREMAREA FUENGIROLA", "43002274");
    addCli("CHUPYTIRA TORREMOLINOS", "43006301");
    addCli("LA MAR DE FRIA CERVECERIA SAN PEDRO", "43006530");
    addCli("LA MAR DE FRIA EL PALO", "43008912");
    addCli("CHUPYTIRA FUENGIROLA", "43007161");
    addCli("LA MIJITA BAR", "43000003");
    addCli("CHUPYTIRA CENTRO", "43018499");
    addCli("LA CEVICHERIA CENTRO", "43000357");
    addCli("LA MAR DE FRIA LA MERCED", "43000357");
    addCli("TAQUERIA MEX CENTRO", "43000357");
    addCli("TAQUERIA MEX TEATINOS", "43000357");
    addCli("LA MAR DE FRIA TEATINOS", "");
    addCli("LA MAR DE FRIA BENALMADENA (PLAYA SANTA ANA) / BRAVO", "43003912");
    addCli("LA MAR DE FRIA PACIFICO", "43003912");
    addCli("PLAYA PITAYA BEACH CLUB", "43009284");
    addCli("LA MAR DE FRIA ESTEPONA / TAQUERIA ESTEPONA", "43007164");
    addCli("LA MAR DE FRIA ECHEVERRIA", "43007164");

    document.getElementById('ctaCli').value = sel.value;
    document.getElementById('msgDb').innerHTML = '✅ v14 Activa - 22 clientes listos. Buscando datos.xlsx...';

    // 3. Cargar configuración
    try {
      var saved = JSON.parse(localStorage.getItem('cfg_v14') || '{}');
      if (saved.w) document.getElementById('wa').value = saved.w;
      if (saved.e) document.getElementById('em').value = saved.e;
    } catch (e) {}

    function guardarDestino() {
      var w = document.getElementById('wa').value.replace(/\D/g, '');
      var e = document.getElementById('em').value.trim();
      localStorage.setItem('cfg_v14', JSON.stringify({ w: w, e: e }));
      document.getElementById('panelConfig').removeAttribute('open');
      alert('✅ Destino guardado.');
    }

    // 4. Leer datos.xlsx desde GitHub para traer tus códigos de barras y precios
    var baseUrl = window.location.href.split('?').at(0);
    if (baseUrl.endsWith('index.html')) baseUrl = baseUrl.replace('index.html', '');
    else if (!baseUrl.endsWith('/')) baseUrl += '/';

    fetch(baseUrl + 'datos.xlsx?t=' + Date.now())
      .then(function(r) { return r.ok ? r.arrayBuffer() : Promise.reject('HTTP ' + r.status); })
      .then(function(buf) {
        if (typeof XLSX === 'undefined') throw new Error('Librería Excel no cargada');
        var wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
        var hoja = Reflect.get(wb.Sheets, wb.SheetNames.at(0));
        var rows = XLSX.utils.sheet_to_json(hoja, { header: 'A', defval: '' });
        
        arts = new Array();
        var modo = '';
        rows.forEach(function(r) {
          var bCol = String(r.B || '').trim();
          var cCol = String(r.C || '').trim();
          if (bCol === 'ARTICULO') { modo = 'A'; return; }
          if (bCol === 'NOMBRE DE RESTAURANTE') { modo = 'C'; return; }
          if (modo === 'A' && bCol) {
            arts.push({
              nom: bCol,
              u: cCol,
              c: String(r.D || '').trim(),
              eq: parseFloat(r.E) || 1,
              pu: parseFloat(r.F) || 0,
              pc: parseFloat(r.G) || 0
            });
          }
        });
        document.getElementById('msgDb').innerHTML = '✅ v14 Activa - ' + arts.length + ' artículos cargados desde datos.xlsx';
      })
      .catch(function(err) {
        document.getElementById('msgDb').innerHTML = '⚠️ v14 Activa (22 clientes listos). No se leyó datos.xlsx: ' + err;
      });

    // 5. Cámara nativa directa
    function alternarCamara() {
      var video = document.getElementById('videoPreview');
      var btn = document.getElementById('btnCam');
      var msg = document.getElementById('camMsg');
      msg.style.display = 'none';

      if (streamActivo) {
        detenerCamara();
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        msg.style.display = 'block';
        msg.innerText = '⚠️ Abre este enlace en Google Chrome o Safari (no dentro de WhatsApp).';
        return;
      }

      btn.innerText = '⏳ Abriendo cámara...';
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function(stream) {
          streamActivo = stream;
          video.srcObject = stream;
          video.style.display = 'block';
          btn.innerText = '⏹️ Cerrar Cámara';

          if ('BarcodeDetector' in window) {
            var detector = new BarcodeDetector({ formats: new Array('ean_13', 'ean_8', 'code_128', 'qr_code', 'upc_a') });
            intervaloScan = setInterval(function() {
              if (video.readyState === video.HAVE_ENOUGH_DATA) {
