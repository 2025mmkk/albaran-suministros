<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albarán Rápido v13</title>
  <style>
    body { font-family: sans-serif; background: #f4f4f4; color: #161616; margin: 0; padding: 12px; }
    .card { background: #fff; border-radius: 10px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    h2, h3 { margin: 0 0 10px 0; color: #0f62fe; font-size: 1.05rem; }
    label { display: block; font-weight: bold; margin-bottom: 4px; font-size: 0.85rem; }
    select, input { width: 100%; padding: 11px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; background: #fff; }
    button { width: 100%; padding: 13px; background: #0f62fe; color: #fff; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 8px; }
    button.success { background: #198038; }
    button.secondary { background: #393939; }
    button.danger { background: #da1e28; width: auto; padding: 5px 10px; font-size: 0.8rem; }
    video { width: 100%; max-height: 260px; background: #000; border-radius: 8px; margin-bottom: 10px; display: none; object-fit: cover; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border-bottom: 1px solid #ddd; padding: 7px 4px; text-align: left; }
    .total-box { font-size: 1.25rem; font-weight: bold; text-align: right; margin-top: 10px; color: #198038; }
    .status { padding: 8px 10px; border-radius: 6px; margin-bottom: 12px; font-size: 0.85rem; background: #defbe6; color: #0e6027; font-weight: bold; }
    details { background: #e5f6ff; padding: 10px; border-radius: 8px; margin-bottom: 12px; border-left: 4px solid #0f62fe; }
    summary { font-weight: bold; cursor: pointer; color: #0f62fe; }
    .aviso { font-size: 0.85rem; color: #a2191f; background: #fff1f1; padding: 8px; border-radius: 6px; margin-bottom: 8px; display: none; }
    .fila-doble { display: flex; gap: 10px; }
    .fila-doble > div { flex: 1; }
  </style>
</head>
<body class="notranslate">

  <div id="msgDb" class="status">⚡ v13 Lista - 22 Clientes cargados al instante</div>

  <!-- CONFIGURACIÓN DESPLEGABLE -->
  <details id="panelConfig">
    <summary>⚙️ Configurar WhatsApp o Correo de destino</summary>
    <div style="margin-top: 10px;">
      <label>📱 WhatsApp destino (ej: 34600112233):</label>
      <input type="tel" id="wa" placeholder="34600112233">
      <label>📧 Correo destino:</label>
      <input type="email" id="em" placeholder="almacen@empresa.com">
      <button type="button" class="success" id="btnSave">💾 Guardar Destino</button>
    </div>
  </details>

  <!-- 1. CLIENTE Y FECHA -->
  <div class="card">
    <h2>1. Datos del Albarán</h2>
    
    <label for="selCli">Restaurante:</label>
    <select id="selCli"></select>

    <div class="fila-doble">
      <div>
        <label for="ctaCli">Cuenta Cliente:</label>
        <input type="text" id="ctaCli" readonly style="background:#eee;" placeholder="Cuenta">
      </div>
      <div>
        <label for="fechaAlb">📅 Fecha Albarán:</label>
        <input type="date" id="fechaAlb">
      </div>
    </div>
  </div>

  <!-- 2. ESCÁNER NATIVO -->
  <div class="card">
    <h2>2. Escaneo de Suministros</h2>
    <button type="button" class="secondary" id="btnCam">📷 Abrir Cámara</button>
    <div id="camMsg" class="aviso"></div>
    <video id="videoPreview" playsinline autoplay muted></video>

    <label>Código de Barras:</label>
    <input type="text" id="cod" placeholder="Escanea o escribe el código...">
    
    <div style="display:flex; gap:8px;">
      <input type="number" id="cant" value="1" min="1" style="flex:1;">
      <button type="button" id="btnAdd" style="flex:2;">➕ Añadir</button>
    </div>
  </div>

  <!-- 3. ALBARÁN ACTUAL -->
  <div class="card">
    <h3>Albarán Actual</h3>
    <table>
      <thead><tr><th>Artículo</th><th>Cant</th><th>Subt</th><th></th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
    <div class="total-box">TOTAL: <span id="tot">0.00</span> €</div>
    <br>
    <button type="button" class="success" id="btnEnviar">🚀 Finalizar, Descargar y Enviar</button>
  </div>

  <script>
    var clientes = [
      { n: "LA MAR DE FRIA ALHAURIN", c: "43003904" },
      { n: "LA MAR DE FRIA HOSPITAL CIVIL / ARROYO LOS ANGELES", c: "43003904" },
      { n: "LA SUBASTA BENALMADENA", c: "43004696" },
      { n: "OASIS BEACH CLUB", c: "43004678" },
      { n: "CAMPOSOL", c: "43001140" },
      { n: "ENTREMAREA FUENGIROLA", c: "43002274" },
      { n: "CHUPYTIRA TORREMOLINOS", c: "43006301" },
      { n: "LA MAR DE FRIA CERVECERIA SAN PEDRO", c: "43006530" },
      { n: "LA MAR DE FRIA EL PALO", c: "43008912" },
      { n: "CHUPYTIRA FUENGIROLA", c: "43007161" },
      { n: "LA MIJITA BAR", c: "43000003" },
      { n: "CHUPYTIRA CENTRO", c: "43018499" },
      { n: "LA CEVICHERIA CENTRO", c: "43000357" },
      { n: "LA MAR DE FRIA LA MERCED", c: "43000357" },
      { n: "TAQUERIA MEX CENTRO", c: "43000357" },
      { n: "TAQUERIA MEX TEATINOS", c: "43000357" },
      { n: "LA MAR DE FRIA TEATINOS", c: "" },
      { n: "LA MAR DE FRIA BENALMADENA (PLAYA SANTA ANA) / BRAVO", c: "43003912" },
      { n: "LA MAR DE FRIA PACIFICO", c: "43003912" },
      { n: "PLAYA PITAYA BEACH CLUB", c: "43009284" },
      { n: "LA MAR DE FRIA ESTEPONA / TAQUERIA ESTEPONA", c: "43007164" },
      { n: "LA MAR DE FRIA ECHEVERRIA", c: "43007164" }
    ];

    var arts = [
      { nom: "ABRILLANTADOR MQ 5LT", u: "", c: "", pu: 4.73, pc: 0 },
      { nom: "ACEITE OLIVA EV 5LT", u: "", c: "", pu: 19.75, pc: 0 },
      { nom: "BAYETA 30X40 AMARILLA 10U", u: "", c: "", pu: 3.20, pc: 0 },
      { nom: "BAYETA 30X40 AZUL 10U", u: "", c: "", pu: 3.20, pc: 0 },
      { nom: "BAYETA 30X40 ROJA 10U", u: "", c: "", pu: 3.20, pc: 0 },
      { nom: "BAYETA 30X40 VERDE 10U", u: "", c: "", pu: 3.20, pc: 0 },
      { nom: "BAYETA PUNTO AZ 3K", u: "", c: "", pu: 9.91, pc: 0 }
    ];

    var lineas = [];
    var streamActivo = null;
    var intervaloScan = null;

    // 1. Fijar fecha actual automáticamente (modificable por el usuario)
    var hoy = new Date();
    var yyyy = hoy.getFullYear();
    var mm = String(hoy.getMonth() + 1).padStart(2, '0');
    var dd = String(hoy.getDate()).padStart(2, '0');
    document.getElementById('fechaAlb').value = yyyy + '-' + mm + '-' + dd;

    // 2. Llenar desplegable de clientes al instante
    var sel = document.getElementById('selCli');
    clientes.forEach(function(item) {
      var o = document.createElement('option');
      o.text = item.n;
      o.value = item.c;
      sel.add(o);
    });
    document.getElementById('ctaCli').value = sel.value;

    sel.addEventListener('change', function() {
      document.getElementById('ctaCli').value = this.value;
    });

    // 3. Configuración guardada
    document.getElementById('btnSave').addEventListener('click', function() {
      var w = document.getElementById('wa').value.replace(/\D/g, '');
      var e = document.getElementById('em').value.trim();
      localStorage.setItem('cfg_v13', JSON.stringify({ w: w, e: e }));
      document.getElementById('panelConfig').removeAttribute('open');
      alert('✅ Destino guardado.');
    });

    try {
      var saved = JSON.parse(localStorage.getItem('cfg_v13') || '{}');
      if (saved.w) document.getElementById('wa').value = saved.w;
      if (saved.e) document.getElementById('em').value = saved.e;
    } catch (e) {}

    // 4. Cámara nativa
    document.getElementById('btnCam').addEventListener('click', function() {
      var video = document.getElementById('videoPreview');
      var btn = this;
      var msg = document.getElementById('camMsg');
      msg.style.display = 'none';

      if (streamActivo) {
        detenerCamara();
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        msg.style.display = 'block';
        msg.innerText = '⚠️ Abre este enlace en Google Chrome o Safari (no dentro de WhatsApp) para usar la cámara.';
        return;
      }

      btn.innerText = '⏳ Abriendo cámara...';
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function(stream) {
          streamActivo = stream;
          video.srcObject = stream;
          video.style.display = 'block';
          btn.innerText = '⏹️ Cerrar Cámara';

          if ('BarcodeDetector' in window) {
            var detector = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'code_128', 'qr_code', 'upc_a'] });
            intervaloScan = setInterval(function() {
              if (video.readyState === video.HAVE_ENOUGH_DATA) {
                detector.detect(video).then(function(barcodes) {
                  if (barcodes.length > 0) {
                    var codigoLeido = barcodes.at(0).rawValue;
                    document.getElementById('cod').value = codigoLeido;
                    if (navigator.vibrate) navigator.vibrate(150);
                    agregarArticulo();
                  }
                }).catch(function() {});
              }
            }, 600);
          } else {
            msg.style.display = 'block';
            msg.innerText = '📷 Cámara abierta. Si tu navegador no lee automático, escribe el código abajo.';
          }
        })
        .catch(function(err) {
          btn.innerText = '📷 Abrir Cámara';
          msg.style.display = 'block';
          msg.innerText = '❌ Permiso de cámara denegado o no disponible (' + err.name + ').';
        });
    });

    function detenerCamara() {
      var video = document.getElementById('videoPreview');
      if (intervaloScan) clearInterval(intervaloScan);
      if (streamActivo) {
        streamActivo.getTracks().forEach(function(track) { track.stop(); });
        streamActivo = null;
      }
