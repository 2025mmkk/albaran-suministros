<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albaran Suministros</title>
<style>
body{font-family:sans-serif;background:#f4f4f4;color:#161616;margin:0;padding:12px}
.card{background:#fff;border-radius:10px;padding:15px;margin-bottom:12px;box-shadow:0 2px 5px rgba(0,0,0,.1)}
h2,h3{margin:0 0 10px 0;color:#0f62fe;font-size:1.05rem}
label{display:block;font-weight:bold;margin-bottom:4px;font-size:.85rem}
select,input{width:100%;padding:11px;margin-bottom:10px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;font-size:1rem;background:#fff}
button{width:100%;padding:13px;background:#0f62fe;color:#fff;border:none;border-radius:6px;font-size:1rem;font-weight:bold;cursor:pointer;margin-bottom:8px}
button.success{background:#198038}
button.secondary{background:#393939}
button.danger{background:#da1e28;width:auto;padding:5px 10px;font-size:.8rem}
video{width:100%;max-height:250px;background:#000;border-radius:8px;margin-bottom:10px;display:none}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th,td{border-bottom:1px solid #ddd;padding:7px 4px;text-align:left}
.total-box{font-size:1.25rem;font-weight:bold;text-align:right;margin-top:10px;color:#198038}
.status{padding:8px 10px;border-radius:6px;margin-bottom:12px;font-size:.85rem;background:#defbe6;color:#0e6027;font-weight:bold}
details{background:#e5f6ff;padding:10px;border-radius:8px;margin-bottom:12px;border-left:4px solid #0f62fe}
summary{font-weight:bold;cursor:pointer;color:#0f62fe}
.fila{display:flex;gap:10px}.fila div{flex:1}
</style>
</head>
<body>
<div id="estado" class="status">Cargando...</div>
<details id="panelConfig">
<summary>Configurar WhatsApp o Correo de destino</summary>
<div style="margin-top:10px">
<label>WhatsApp destino (ej: 34600112233):</label>
<input type="tel" id="wa" placeholder="34600112233">
<label>Correo destino:</label>
<input type="email" id="em" placeholder="almacen@empresa.com">
<button type="button" class="success" onclick="guardarCfg()">Guardar Destino</button>
</div>
</details>
<div class="card">
<h2>1. Datos del Albaran</h2>
<label>Restaurante:</label>
<select id="clientes" onchange="document.getElementById('cuenta').value=this.value"></select>
<div class="fila">
<div><label>Cuenta Cliente:</label><input type="text" id="cuenta" readonly style="background:#eee"></div>
<div><label>Fecha Albaran:</label><input type="date" id="fecha"></div>
</div>
</div>
<div class="card">
<h2>2. Escaneo de Suministros</h2>
<button type="button" class="secondary" id="btnCam" onclick="toggleCam()">Abrir Camara</button>
<video id="videoPreview" playsinline autoplay muted></video>
<label>Codigo de Barras:</label>
<input type="text" id="codigo" placeholder="Escanea o escribe el codigo...">
<div style="display:flex;gap:8px">
<input type="number" id="cantidad" value="1" min="1" style="flex:1">
<button type="button" onclick="agregar()" style="flex:2">Anadir</button>
</div>
</div>
<div class="card">
<h3>Albaran Actual</h3>
<table><thead><tr><th>Articulo</th><th>Cant</th><th>Subt</th><th></th></tr></thead><tbody id="tabla"></tbody></table>
<div class="total-box">TOTAL: <span id="total">0.00</span> EUR</div><br>
<button type="button" class="success" onclick="enviar()">Finalizar, Descargar y Enviar</button>
</div>

<script>
var sel = document.getElementById('clientes');
function addCli(n, c) { var op = document.createElement('option'); op.text = n; op.value = c; sel.add(op); }
addCli("LA MAR DE FRIA ALHAURIN", "43003904");
addCli("LA MAR DE FRIA HOSPITAL CIVIL / ARROYO LOS ANGELES", "43003904");
addCli("LA SUBASTA BENALMADENA", "43004696");
addCli("OASIS BEACH CLUB", "43004678");
addCli("CAMPOSOL", "43001140");
addCli("ENTREMAREA FUENGIROLA", "43002274");
addCli("CHUPYTIRA TORREMOLINOS", "43006301");
addCli("LA MAR DE FRIA CERVECERIA SAN PEDRO", "43006530");
addCli("LA MAR DE FRIA EL PALO", "43008912");
addCli("CHUPYTIRA FUENGIROLA", "43007161");
addCli("LA MIJITA BAR", "43000003");
addCli("CHUPYTIRA CENTRO", "43018499");
addCli("LA CEVICHERIA CENTRO", "43000357");
addCli("LA MAR DE FRIA LA MERCED", "43000357");
addCli("TAQUERIA MEX CENTRO", "43000357");
addCli("TAQUERIA MEX TEATINOS", "43000357");
addCli("LA MAR DE FRIA TEATINOS", "");
addCli("LA MAR DE FRIA BENALMADENA (PLAYA SANTA ANA) / BRAVO", "43003912");
addCli("LA MAR DE FRIA PACIFICO", "43003912");
addCli("PLAYA PITAYA BEACH CLUB", "43009284");
addCli("LA MAR DE FRIA ESTEPONA / TAQUERIA ESTEPONA", "43007164");
addCli("LA MAR DE FRIA ECHEVERRIA", "43007164");
document.getElementById('cuenta').value = sel.value;
var hoy = new Date();
document.getElementById('fecha').value = hoy.getFullYear() + '-' + ('0' + (hoy.getMonth() + 1)).slice(-2) + '-' + ('0' + hoy.getDate()).slice(-2);
document.getElementById('estado').innerText = 'OK - Clientes y fecha listos';
</script>
<script src="https://unpkg.com"></script>
<script>
var URL_GOOGLE_SHEETS = "https://google.com";

var catalogo = new Array();
var lineas = new Array();
var codeReader = null;
var camaraAbierta = false;

function addProd(nom, u, c, eq, pu, pc) {
  catalogo.push({ nom: nom, u: String(u).trim(), c: String(c).trim(), eq: eq || 1, pu: pu || 0, pc: pc || 0 });
}

addProd("ABRILLANTADOR MQ 5LT", "8000500082379", "8480000795946", 4, 4.73, 0);
addProd("ACEITE OLIVA EV 5LT", "", "", 1, 19.75, 0);
addProd("BAYETA 30X40 AMARILLA 10U", "", "", 1, 3.20, 0);
addProd("BAYETA 30X40 AZUL 10U", "", "", 1, 3.20, 0);
addProd("BAYETA 30X40 ROJA 10U", "", "", 1, 3.20, 0);
addProd("BAYETA 30X40 VERDE 10U", "", "", 1, 3.20, 0);
addProd("BAYETA PUNTO AZ 3K", "", "", 1, 9.91, 0);

function cargarDesdeGoogle() {
  document.getElementById('estado').innerText = 'Sincronizando con Google Sheets...';
  var proxyUrl = 'https://allorigins.win' + encodeURIComponent(URL_GOOGLE_SHEETS + '&t=' + Date.now());
  
  fetch(proxyUrl).then(function(r) {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  }).then(function(texto) {
    var filas = texto.split(/\r?\n/);
    var modo = '';
    var colBase = 1;
    var nuevosProd = new Array();
    var nuevosCli = new Array();

    filas.forEach(function(linea) {
      var cols = linea.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
      var c0 = (cols.at(0) || '').replace(/^"|"$/g, '').trim();
      var c1 = (cols.at(1) || '').replace(/^"|"$/g, '').trim();

      if (c0 === 'ARTICULO' || c1 === 'ARTICULO') {
        modo = 'ART';
        colBase = (c0 === 'ARTICULO') ? 0 : 1;
        return;
      }
      if (c0 === 'NOMBRE DE RESTAURANTE' || c1 === 'NOMBRE DE RESTAURANTE') {
        modo = 'CLI';
        colBase = (c0 === 'NOMBRE DE RESTAURANTE') ? 0 : 1;
        return;
      }

      var nombre = (cols.at(colBase) || '').replace(/^"|"$/g, '').trim();
      var dato1 = (cols.at(colBase + 1) || '').replace(/^"|"$/g, '').trim();

      if (modo === 'ART' && Boolean(nombre)) {
        var eanC = (cols.at(colBase + 2) || '').replace(/^"|"$/g, '').trim();
        var equiv = parseFloat((cols.at(colBase + 3) || '1').replace(/^"|"$/g, '').replace(',', '.')) || 1;
        var pUnid = parseFloat((cols.at(colBase + 4) || '0').replace(/^"|"$/g, '').replace(',', '.')) || 0;
        var pCaja = parseFloat((cols.at(colBase + 5) || '0').replace(/^"|"$/g, '').replace(',', '.')) || 0;
        nuevosProd.push({ nom: nombre, u: dato1, c: eanC, eq: equiv, pu: pUnid, pc: pCaja });
      } else if (modo === 'CLI' && Boolean(nombre)) {
        nuevosCli.push({ n: nombre, c: dato1 });
      }
    });

    if (Boolean(nuevosProd.length)) catalogo = nuevosProd;
    if (Boolean(nuevosCli.length)) {
      sel.innerHTML = '';
      nuevosCli.forEach(function(item) { addCli(item.n, item.c); });
      document.getElementById('cuenta').value = sel.value;
    }
    document.getElementById('estado').innerText = 'OK - Sincronizado con Google (' + catalogo.length + ' articulos y ' + sel.options.length + ' clientes)';
  }).catch(function() {
    document.getElementById('estado').innerText = 'OK - Modo local activo (' + catalogo.length + ' articulos)';
  });
}

cargarDesdeGoogle();

try {
  var saved = JSON.parse(localStorage.getItem('alb_cfg') || '{}');
  if (saved.w) document.getElementById('wa').value = saved.w;
  if (saved.e) document.getElementById('em').value = saved.e;
} catch (e) {}

function guardarCfg() {
  var w = document.getElementById('wa').value.replace(/\D/g, '');
  var e = document.getElementById('em').value.trim();
  localStorage.setItem('alb_cfg', JSON.stringify({ w: w, e: e }));
  document.getElementById('panelConfig').removeAttribute('open');
  alert('Destino guardado');
}

function toggleCam() {
  var video = document.getElementById('videoPreview');
  var btn = document.getElementById('btnCam');

  if (camaraAbierta) {
    if (codeReader) codeReader.reset();
    video.style.display = 'none';
    btn.innerText = 'Abrir Camara';
    camaraAbierta = false;
    return;
  }

  if (typeof ZXing === 'undefined') {
    alert('El lector de camara aun esta cargando, intenta de nuevo en 2 segundos.');
    return;
  }

  btn.innerText = 'Iniciando lector...';
  video.style.display = 'block';
  camaraAbierta = true;
  codeReader = new ZXing.BrowserMultiFormatReader();

  codeReader.decodeFromConstraints(
    { video: { facingMode: 'environment' } },
    'videoPreview',
    function(result, err) {
      if (result) {
        var textoLeido = result.getText();
        document.getElementById('codigo').value = textoLeido;
        if (navigator.vibrate) navigator.vibrate(150);
        agregar();
        codeReader.reset();
        video.style.display = 'none';
        btn.innerText = 'Abrir Camara (Leido OK)';
        camaraAbierta = false;
      }
    }
  ).then(function() {
    btn.innerText = 'Cerrar Camara';
  }).catch(function(err) {
    video.style.display = 'none';
    btn.innerText = 'Abrir Camara';
    camaraAbierta = false;
    alert('Error al abrir camara: ' + err);
  });
}

function agregar() {
  var cod = document.getElementById('codigo').value.trim();
  var cant = parseInt(document.getElementById('cantidad').value, 10) || 1;
  if (!cod) { alert('Escribe o escanea un codigo primero'); return; }
  var enc = null, tipo = 'UNID', pr = 0;

  catalogo.forEach(function(p) {
    if (p.u === cod && !enc) {
      enc = p;
      pr = p.pu;
    } else if (p.c === cod && !enc) {
      enc = p;
      tipo = 'CAJA x' + p.eq;
      pr = Boolean(p.pc) ? p.pc : (p.pu * p.eq);
    }
  });

  var yaExiste = null;
  lineas.forEach(function(l) {
    if (l.cod === cod) yaExiste = l;
  });

  if (yaExiste) {
    yaExiste.cant += cant;
    yaExiste.sub = yaExiste.cant * yaExiste.pr;
  } else {
    var nombre = enc ? (enc.nom + ' (' + tipo + ')') : ('Articulo EAN: ' + cod);
    lineas.push({ cod: cod, nom: nombre, cant: cant, pr: pr, sub: cant * pr });
  }

  document.getElementById('codigo').value = '';
  document.getElementById('cantidad').value = 1;
  dibujar();
}

function cambiarCant(i, delta) {
  var item = lineas.at(i);
  item.cant += delta;
  if (item.cant === 0) {
    lineas.splice(i, 1);
  } else {
    item.sub = item.cant * item.pr;
  }
  dibujar();
}

function borrarLinea(i) { lineas.splice(i, 1); dibujar(); }

function dibujar() {
  var tb = document.getElementById('tabla');
  tb.innerHTML = '';
  var total = 0;
  lineas.forEach(function(l, i) {
    total += l.sub;
    tb.innerHTML += '<tr>' +
      '<td>' + l.nom + '</td>' +
      '<td style="white-space:nowrap;">' +
        '<button type="button" style="width:28px;padding:4px;margin:0;background:#525252;" onclick="cambiarCant(' + i + ',-1)">-</button> ' +
        '<b>' + l.cant + '</b> ' +
        '<button type="button" style="width:28px;padding:4px;margin:0;background:#0f62fe;" onclick="cambiarCant(' + i + ',1)">+</button>' +
      '</td>' +
      '<td>' + l.sub.toFixed(2) + '</td>' +
      '<td><button class="danger" onclick="borrarLinea(' + i + ')">X</button></td>' +
    '</tr>';
  });
  document.getElementById('total').innerText = total.toFixed(2);
}

function enviar() {
  if (!lineas.length) { alert('El albaran esta vacio'); return; }
  var cli = sel.options.item(sel.selectedIndex).text;
  var cta = document.getElementById('cuenta').value;
  var fec = document.getElementById('fecha').value;
  var tot = document.getElementById('total').innerText;
  var csv = '\uFEFFFORMULARIO DE SUMINISTRO;;;;\nFECHA;' + fec + ';;;\nRESTAURANTE;' + cli + ';;;\nCUENTA;' + cta + ';;;\nCODIGO;ARTICULO;UNIDADES;PRECIO;SUBTOTAL\n';
  lineas.forEach(function(l) { csv += l.cod + ';' + l.nom + ';' + l.cant + ';' + l.pr.toFixed(2) + ';' + l.sub.toFixed(2) + '\n'; });
  csv += ';;;TOTAL;' + tot + '\n';
  var blob = new Blob(new Array(csv), { type: 'text/csv;charset=utf-8;' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'Albaran_' + cli.replace(/\W/g, '_') + '_' + fec + '.csv';
  a.click();
  var txt = 'ALBARAN SUMINISTROS\nFecha: ' + fec + '\nRestaurante: ' + cli + '\nCuenta: ' + cta + '\n----------------\n';
  lineas.forEach(function(l) { txt += '- ' + l.cant + 'x ' + l.nom + ' (' + l.sub.toFixed(2) + ' EUR)\n'; });
  txt += '----------------\nTOTAL: ' + tot + ' EUR';
  var cfg = JSON.parse(localStorage.getItem('alb_cfg') || '{}');
  if (cfg.w) window.open('https://wa.me' + cfg.w + '?text=' + encodeURIComponent(txt), '_blank');
  if (cfg.e) window.location.href = 'mailto:' + cfg.e + '?subject=' + encodeURIComponent('Albaran ' + cli) + '&body=' + encodeURIComponent(txt);
}
</script>
</body>
</html>
