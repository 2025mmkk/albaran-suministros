<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albarán Móvil v2.0</title>
  <script src="https://sheetjs.com"></script>
  <script src="https://unpkg.com" type="text/javascript"></script>
  <style>
    :root { --primary: #0f62fe; --bg: #f4f4f4; --card: #ffffff; --text: #161616; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; }
    .card { background: var(--card); border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
    h2, h3 { margin-top: 0; font-size: 1.1rem; color: var(--primary); }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
    select, input[type="text"], input[type="email"], input[type="tel"], input[type="number"] {
      width: 100%; padding: 12px; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 1rem; background: #fff;
    }
    button {
      width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 6px;
      font-size: 1rem; font-weight: bold; cursor: pointer; margin-bottom: 10px;
    }
    button.secondary { background: #393939; }
    button.success { background: #198038; }
    button.danger { background: #da1e28; padding: 6px 10px; width: auto; font-size: 0.85rem; }
    button.small-btn { width: auto; padding: 6px 12px; font-size: 0.8rem; background: #525252; float: right; margin: 0; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 10px; display: none; }
    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { border-bottom: 1px solid #ddd; padding: 8px 4px; text-align: left; }
    th { background: #e0e0e0; }
    .total-box { font-size: 1.25rem; font-weight: bold; text-align: right; margin-top: 10px; color: #198038; }
    .badge { background: #e0e0e0; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; }
    .config-banner { background: #e5f6ff; border-left: 4px solid var(--primary); padding: 10px; margin-bottom: 15px; border-radius: 4px; font-size: 0.85rem; overflow: hidden; line-height: 28px; }
    .status-bar { font-size: 0.85rem; padding: 10px; border-radius: 6px; margin-bottom: 12px; background: #defbe6; color: #0e6027; border: 1px solid #a7f0ba; }
    .status-error { background: #fff1f1; color: #a2191f; border: 1px solid #ffb3b8; }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR DE CONFIGURACIÓN GUARDADA -->
  <div id="configBanner" class="config-banner" style="display:none;">
    <button type="button" class="small-btn" onclick="abrirConfig()">⚙️ Cambiar destino</button>
    <span id="resumenConfig"></span>
  </div>

  <!-- 0. CONFIGURACIÓN INICIAL -->
  <div class="card" id="setupSection">
    <h2>⚙️ Configuración de Envío (v2.0)</h2>
    <p style="font-size: 0.85rem; color: #525252; margin-top: 0;">Rellena el destino al que quieres enviar los albaranes (puedes rellenar uno o ambos):</p>
    
    <label for="destinoWhatsapp">📱 Teléfono WhatsApp (con prefijo país, ej: 34600112233):</label>
    <input type="tel" id="destinoWhatsapp" placeholder="34600112233" />

    <label for="destinoEmail">📧 Correo Electrónico de recepción:</label>
    <input type="email" id="destinoEmail" placeholder="almacen@empresa.com" />

    <button type="button" class="success" onclick="guardarConfig()">💾 Guardar y Entrar a la App</button>
    <button type="button" class="secondary" onclick="entrarSinConfig()">⏩ Entrar directamente (Configurar luego)</button>
  </div>

  <!-- APLICACIÓN PRINCIPAL -->
  <div id="appPrincipal" style="display:none;">
    
    <div id="dbStatus" class="status-bar">⏳ Cargando base de datos desde GitHub...</div>

    <!-- 1. DATOS DEL CLIENTE -->
    <div class="card" id="clienteSection" style="display:none;">
      <h2>1. Selección de Cliente</h2>
      <label for="selectCliente">Restaurante:</label>
      <select id="selectCliente" onchange="cambiarCliente()"></select>
      <label>Cuenta Cliente:</label>
      <input type="text" id="cuentaCliente" readonly style="background: #e8e8e8;" />
    </div>

    <!-- 2. ESCÁNER Y ENTRADA DE ARTÍCULOS -->
    <div class="card" id="escanerSection" style="display:none;">
      <h2>2. Escaneo de Suministros</h2>
      <button type="button" id="btnToggleCamara" class="secondary" onclick="toggleCamara()">📷 Abrir Cámara para Escanear</button>
      <div id="reader"></div>

      <label for="inputCodigo">Código de Barras (EAN Unidad o Caja):</label>
      <input type="text" id="inputCodigo" placeholder="Escanea o escribe el código..." />

      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label for="inputCantidad">Cantidad:</label>
          <input type="number" id="inputCantidad" value="1" min="1" />
        </div>
        <div style="flex: 2; display: flex; align-items: flex-end;">
          <button type="button" onclick="agregarManual()">➕ Añadir al Albarán</button>
        </div>
      </div>
    </div>

    <!-- 3. RESUMEN DEL ALBARÁN Y ENVÍO -->
    <div class="card" id="albaranSection" style="display:none;">
      <h3>Albarán Actual</h3>
      <div style="overflow-x: auto;">
        <table id="tablaAlbaran">
          <thead>
            <tr>
              <th>Artículo</th>
              <th>Cant.</th>
              <th>Precio</th>
              <th>Subtotal</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="total-box">TOTAL: <span id="totalAlbaran">0.00</span> €</div>
      <br>
      <button type="button" class="success" onclick="finalizarYEnviar()">🚀 Finalizar, Descargar y Enviar</button>
    </div>

  </div>

  <script>
    var baseArticulos = [];
    var baseClientes = [];
    var lineasAlbaran = [];
    var html5QrCode = null;
    var camaraActiva = false;
    var configActual = { whatsapp: '', email: '' };

    function guardarConfig() {
      var wa = document.getElementById('destinoWhatsapp').value.replace(/\D/g, '');
      var em = document.getElementById('destinoEmail').value.trim();

      if (!wa && !em) {
        alert("Introduce al menos un teléfono de WhatsApp o un Correo Electrónico, o pulsa 'Entrar directamente'.");
        return;
      }

      configActual = { whatsapp: wa, email: em };
      try {
        localStorage.setItem('albaran_config_v2', JSON.stringify(configActual));
      } catch (e) {}
      mostrarApp();
    }

    function entrarSinConfig() {
      mostrarApp();
    }

    function abrirConfig() {
      document.getElementById('destinoWhatsapp').value = configActual.whatsapp || '';
      document.getElementById('destinoEmail').value = configActual.email || '';
      document.getElementById('setupSection').style.display = 'block';
      document.getElementById('appPrincipal').style.display = 'none';
      document.getElementById('configBanner').style.display = 'none';
    }

    function mostrarApp() {
      document.getElementById('setupSection').style.display = 'none';
      document.getElementById('appPrincipal').style.display = 'block';
      document.getElementById('configBanner').style.display = 'block';

      var partes = [];
      if (configActual.whatsapp) partes.push('WA: +' + configActual.whatsapp);
      if (configActual.email) partes.push('Email: ' + configActual.email);
      document.getElementById('resumenConfig').innerHTML = partes.length > 0 ? '<b>Destino:</b> ' + partes.join(' | ') : '<b>Sin destino configurado</b>';
    }

    window.onload = function() {
      try {
        var guardada = localStorage.getItem('albaran_config_v2');
        if (guardada) {
          configActual = JSON.parse(guardada);
          mostrarApp();
        }
      } catch (e) {}
      cargarExcelDesdeGitHub();
    };

    function cargarExcelDesdeGitHub() {
      var statusDiv = document.getElementById('dbStatus');
      fetch('datos.xlsx?t=' + Date.now())
        .then(function(res) {
          if (!res.ok) throw new Error('No se encuentra datos.xlsx');
          return res.arrayBuffer();
        })
        .then(function(buf) {
          var wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
          var hoja = wb.Sheets[wb.SheetNames[0]];
          var filas = XLSX.utils.sheet_to_json(hoja, { header: 1 });
          procesarHojaMaestra(filas);
        })
        .catch(function(err) {
          statusDiv.className = 'status-bar status-error';
          statusDiv.innerHTML = '❌ <b>Falta datos.xlsx:</b> Sube tu archivo Excel renombrado como <b>datos.xlsx</b> a tu repositorio de GitHub.';
        });
    }

    function procesarHojaMaestra(filas) {
      baseArticulos = [];
      baseClientes = [];
      var modo = '';

      for (var i = 0; i < filas.length; i++) {
        var f = filas[i];
        if (!f || f.length === 0) continue;

        var colB = (f[1] !== undefined && f[1] !== null) ? f[1].toString().trim() : '';
        var colC = (f[2] !== undefined && f[2] !== null) ? f[2].toString().trim() : '';

        if (colB === 'ARTICULO') { modo = 'ARTICULOS'; continue; }
        if (colB === 'NOMBRE DE RESTAURANTE') { modo = 'CLIENTES'; continue; }

        if (modo === 'ARTICULOS' && colB !== '') {
          baseArticulos.push({
            articulo: colB,
            eanUnidad: colC,
            eanCaja: (f[3] !== undefined && f[3] !== null) ? f[3].toString().trim() : '',
            equivalencia: parseFloat(f[4]) || 1,
            precioUnidad: parseFloat(f[5]) || 0,
            precioCaja: parseFloat(f[6]) || 0
          });
        } else if (modo === 'CLIENTES' && colB !== '') {
          baseClientes.push({ nombre: colB, cuenta: colC });
        }
      }

      var select = document.getElementById('selectCliente');
      select.innerHTML = '';
